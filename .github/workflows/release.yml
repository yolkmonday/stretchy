name: release

# Push tag vX.Y.Z -> build universal, sign + notarize, publish .dmg/.pkg ke GitHub Release,
# lalu bump cask yolkmonday/homebrew-tap (kalau secret HOMEBREW_TAP_TOKEN ada).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Rilis lokal (build-app.sh + gh release create) sudah publish -> CI skip.
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.r.outputs.exists }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo exists=true >> "$GITHUB_OUTPUT"
          else
            echo exists=false >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          ids="$(security find-identity -v "$KC")"
          echo "SIGN_IDENTITY=$(grep -o '"Developer ID Application[^"]*"' <<<"$ids" | head -1 | tr -d '"')" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$(grep -o '"Developer ID Installer[^"]*"' <<<"$ids" | head -1 | tr -d '"')" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        env:
          NOTARIZE: '1'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Stretchy-$V.dmg" "dist/Stretchy-$V.pkg" \
            --title "Stretchy $V" --generate-notes

      - name: Bump Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.GH_TOKEN != ''
        run: |
          V="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "dist/Stretchy-$V.dmg" | cut -d' ' -f1)"
          gh repo clone yolkmonday/homebrew-tap tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$V\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            -e 's|/Stretchy-#{version}\.zip"|/Stretchy-#{version}.dmg"|' Casks/stretchy.rb
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -am "stretchy $V"
          gh auth setup-git
          git push
